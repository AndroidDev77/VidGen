server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A CSP-compatible single-page app: no inline scripts, no eval, and only
    # same-origin subresources. `connect-src 'self'` is sufficient because the
    # API is reverse-proxied under /api on this same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The API upstream, so the browser stays same-origin and CORS stays off.
    # VIDGEN_API_UPSTREAM is substituted into this file at container start.
    location /api/ {
        proxy_pass ${VIDGEN_API_UPSTREAM};
        proxy_http_version 1.1;
        # $proxy_host is the upstream's own host, not the browser's. Container
        # Apps routes an internal request by the Host header and terminates TLS
        # with a certificate for that name, so forwarding the browser's host
        # would break both routing and certificate validation. The API reads the
        # original host from the X-Forwarded-* headers below.
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events need an unbuffered, long-lived connection.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Container Apps liveness/readiness probe target. Served by nginx itself so
    # the web revision reports healthy independently of the API revision, and
    # excluded from the SPA fallback below.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
