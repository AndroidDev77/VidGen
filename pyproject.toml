[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vidgen"
version = "0.1.0"
description = "Restartable animated comedy recap pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  # Authenticated encryption for the T25 OAuth credential envelope. Required
  # everywhere, not only in an Azure deployment: a local development database
  # stores the same sealed refresh token as a deployed one.
  "cryptography>=45,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn>=0.35,<1",
  "temporalio>=1.32.0",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "prometheus-client>=0.22,<1",
  "pillow>=11.3,<12",
  "openai>=1.100,<2",
  "runwayml>=3.10,<4",
]

[project.optional-dependencies]
# Installed in the deployed images and in CI. Kept optional so a local
# filesystem/Prometheus deployment never needs the Azure SDKs, and so every
# import of them stays lazy behind a configured backend.
azure = [
  "azure-identity>=1.19,<2",
  "azure-monitor-opentelemetry-exporter>=1.0.0b30",
  "azure-storage-blob>=12.24,<13",
]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vidgen", "apps", "services", "packages"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --durations=25 -n auto"
testpaths = ["tests", "infra/tests"]
pythonpath = ["."]
markers = [
  "postgres: requires a running PostgreSQL database",
  "bicep: requires the Bicep CLI; compiles the infrastructure templates locally",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vidgen"]
