services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vidgen
      POSTGRES_USER: vidgen
      POSTGRES_PASSWORD: vidgen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidgen -d vidgen"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  temporal:
    image: temporalio/temporal:1.8.2
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  azurite-data:
