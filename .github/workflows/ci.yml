name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vidgen_test
          POSTGRES_USER: vidgen
          POSTGRES_PASSWORD: vidgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidgen -d vidgen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIDGEN_DATABASE_URL: postgresql+psycopg://vidgen:vidgen@localhost:5432/vidgen_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest --cov=vidgen --cov-report=term-missing
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: docker build -t vidgen:${{ github.sha }} .
