name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: docker compose up -d postgres redis azurite temporal
      - name: Verify Compose services and migrations
        run: |
          timeout 90 bash -c 'until docker compose exec -T postgres pg_isready -U vidgen -d vidgen; do sleep 2; done'
          test "$(docker compose exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/10000) 2>/dev/null; do sleep 2; done'
          timeout 90 bash -c 'until (echo > /dev/tcp/127.0.0.1/7233) 2>/dev/null; do sleep 2; done'
          VIDGEN_ALLOW_DESTRUCTIVE_MIGRATION_TEST=1 uv run python scripts/verify_stack.py
      - if: always()
        run: docker compose down -v

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vidgen_test
          POSTGRES_USER: vidgen
          POSTGRES_PASSWORD: vidgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidgen -d vidgen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIDGEN_DATABASE_URL: postgresql+psycopg://vidgen:vidgen@localhost:5432/vidgen_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check src apps services packages tests scripts migrations
      - run: uv run mypy --strict src apps services packages scripts
      - run: uv run pytest --cov=vidgen --cov-report=term-missing
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: docker build -t vidgen:${{ github.sha }} .
