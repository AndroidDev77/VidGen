groups:
  - name: vidgen
    rules:
      - {alert: RecapCompletionSuccessLow, expr: 'sum(rate(recap_projects_completed_total{status="success"}[1h])) / clamp_min(sum(rate(recap_projects_completed_total[1h])), 1) < 0.90', for: 10m, labels: {severity: warning}, annotations: {summary: Completion success below threshold, description: Completion success is below 90 percent., runbook: docs/runbooks/observability.md}}
      - {alert: ProviderErrorRateHigh, expr: 'sum(rate(recap_provider_requests_total{status="failure"}[10m])) / clamp_min(sum(rate(recap_provider_requests_total[10m])), 1) > 0.15', for: 10m, labels: {severity: warning}, annotations: {summary: Provider error rate high, description: Provider errors exceed 15 percent., runbook: docs/runbooks/observability.md}}
      - {alert: ProviderRateLimitHigh, expr: 'sum(rate(recap_provider_rate_limit_total[10m])) / clamp_min(sum(rate(recap_provider_requests_total[10m])), 1) > 0.05', for: 10m, labels: {severity: warning}, annotations: {summary: Provider 429 rate high, description: Provider rate limits exceed 5 percent., runbook: docs/runbooks/observability.md}}
      - {alert: ShotGenerationP95Slow, expr: 'histogram_quantile(0.95, sum by (le) (rate(recap_provider_latency_seconds_bucket{operation="video.generate"}[10m]))) > 1200', for: 10m, labels: {severity: warning}, annotations: {summary: Shot generation slow, description: p95 exceeds 20 minutes., runbook: docs/runbooks/observability.md}}
      - {alert: ProjectCostOverWarningBudget, expr: 'recap_project_cost_usd > recap_project_warning_budget_usd * 1.10', for: 5m, labels: {severity: critical}, annotations: {summary: Project cost over warning budget, description: Cost exceeds 110 percent of warning cap., runbook: docs/runbooks/observability.md}}
      - {alert: DuplicateProviderTaskId, expr: 'increase(recap_duplicate_provider_task_id_total[5m]) > 0', labels: {severity: critical}, annotations: {summary: Duplicate provider task ID, description: Provider identity invariant violated., runbook: docs/runbooks/observability.md}}
      - {alert: DuplicateSelectedAsset, expr: 'increase(recap_duplicate_selected_asset_total[5m]) > 0', labels: {severity: critical}, annotations: {summary: Duplicate selected asset, description: Selected asset invariant violated., runbook: docs/runbooks/observability.md}}
      - {alert: RenderVerificationFailureHigh, expr: 'sum(rate(recap_render_verification_total{status="failure"}[10m])) / clamp_min(sum(rate(recap_render_verification_total[10m])), 1) > 0.02', for: 10m, labels: {severity: warning}, annotations: {summary: Render verification failures high, description: Render verification exceeds 2 percent., runbook: docs/runbooks/observability.md}}
